<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hound Coder Auth Admin</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; }
  code { word-break: break-all; }
  .revoked { color: #999; text-decoration: line-through; }
  .blocked { color: #b00020; }
  button { cursor: pointer; }
  #token-box { width: 100%; box-sizing: border-box; }
</style>
</head>
<body>
<h1>Hound Coder Auth Admin</h1>

<label>Your admin bearer token:
  <input id="token-box" type="password" placeholder="paste your admin JWT here">
</label>
<button id="save-token">Save</button>
<button id="refresh">Refresh</button>

<h2>Add user</h2>
<input id="new-email" type="email" placeholder="email@example.com">
<label><input id="new-is-admin" type="checkbox"> admin</label>
<button id="add-user">Add</button>

<h2>Blocklist</h2>
<p>Blocking an email revokes all of its existing tokens and prevents self-registration or new tokens
for that address (works even if it hasn't registered yet).</p>
<input id="block-email" type="email" placeholder="email@example.com">
<input id="block-reason" type="text" placeholder="reason (optional)">
<button id="add-block">Block</button>
<div id="blocklist"></div>

<div id="error" style="color:red"></div>
<div id="users"></div>

<script>
const tokenBox = document.getElementById('token-box');
tokenBox.value = localStorage.getItem('houndCoderAdminToken') || '';

document.getElementById('save-token').onclick = () => {
  localStorage.setItem('houndCoderAdminToken', tokenBox.value);
  loadUsers();
};
document.getElementById('refresh').onclick = () => { loadUsers(); loadBlocklist(); };
document.getElementById('add-user').onclick = addUser;
document.getElementById('add-block').onclick = addBlock;

function authHeaders() {
  return { 'Authorization': 'Bearer ' + (localStorage.getItem('houndCoderAdminToken') || '') };
}

async function api(path, options = {}) {
  const res = await fetch('/admin/api' + path, {
    ...options,
    headers: { ...authHeaders(), 'Content-Type': 'application/json', ...(options.headers || {}) },
  });
  if (!res.ok) {
    throw new Error((await res.text()) || res.statusText);
  }
  return res.status === 204 ? null : res.json();
}

async function loadUsers() {
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';
  try {
    const users = await api('/users');
    render(users);
  } catch (e) {
    errorEl.textContent = 'Failed to load users: ' + e.message;
  }
}

function render(users) {
  const container = document.getElementById('users');
  container.innerHTML = '';
  for (const user of users) {
    const section = document.createElement('div');
    const tokenRows = user.tokens.map(t => `
      <tr>
        <td>${new Date(t.issue_date * 1000).toLocaleString()}</td>
        <td class="${t.revoked ? 'revoked' : ''}"><code>${t.token}</code></td>
        <td>${t.revoked ? '' : `<button data-email="${user.email}" data-issue="${t.issue_date}" class="download-config">Continue config</button>`}</td>
        <td>${t.revoked ? 'revoked' : `<button data-email="${user.email}" data-issue="${t.issue_date}" class="revoke">Revoke</button>`}</td>
      </tr>`).join('');
    section.innerHTML = `
      <h3>${user.email} ${user.is_admin ? '(admin)' : ''} ${user.blocked ? '<span class="blocked">(blocked)</span>' : ''}</h3>
      <button data-email="${user.email}" data-admin="${!user.is_admin}" class="toggle-admin">
        ${user.is_admin ? 'Revoke admin' : 'Make admin'}
      </button>
      <button data-email="${user.email}" class="issue-token">Issue new token</button>
      <button data-email="${user.email}" class="remove-user">Remove user</button>
      ${user.blocked ? '' : `<button data-email="${user.email}" class="block-user">Block</button>`}
      <table><thead><tr><th>Issued</th><th>Token</th><th></th><th></th></tr></thead><tbody>${tokenRows}</tbody></table>
    `;
    container.appendChild(section);
  }

  container.querySelectorAll('.toggle-admin').forEach(btn => btn.onclick = () => withErrorAlert(async () => {
    await api(`/users/${encodeURIComponent(btn.dataset.email)}`, {
      method: 'PATCH', body: JSON.stringify({ is_admin: btn.dataset.admin === 'true' }),
    });
    loadUsers();
  }));
  container.querySelectorAll('.issue-token').forEach(btn => btn.onclick = () => withErrorAlert(async () => {
    await api(`/users/${encodeURIComponent(btn.dataset.email)}/tokens`, { method: 'POST' });
    loadUsers();
  }));
  container.querySelectorAll('.remove-user').forEach(btn => btn.onclick = () => withErrorAlert(async () => {
    if (!confirm(`Remove ${btn.dataset.email}? This revokes all their tokens.`)) return;
    await api(`/users/${encodeURIComponent(btn.dataset.email)}`, { method: 'DELETE' });
    loadUsers();
  }));
  container.querySelectorAll('.revoke').forEach(btn => btn.onclick = () => withErrorAlert(async () => {
    await api(`/users/${encodeURIComponent(btn.dataset.email)}/tokens/${btn.dataset.issue}/revoke`, { method: 'POST' });
    loadUsers();
  }));
  container.querySelectorAll('.download-config').forEach(btn => btn.onclick = () => withErrorAlert(() => downloadConfig(btn.dataset.email, btn.dataset.issue)));
  container.querySelectorAll('.block-user').forEach(btn => btn.onclick = () => withErrorAlert(async () => {
    if (!confirm(`Block ${btn.dataset.email}? This revokes all their tokens.`)) return;
    await api('/blocklist', { method: 'POST', body: JSON.stringify({ email: btn.dataset.email }) });
    loadUsers();
    loadBlocklist();
  }));
}

async function loadBlocklist() {
  try {
    renderBlocklist(await api('/blocklist'));
  } catch (e) {
    document.getElementById('error').textContent = 'Failed to load blocklist: ' + e.message;
  }
}

function renderBlocklist(entries) {
  const container = document.getElementById('blocklist');
  if (entries.length === 0) {
    container.innerHTML = '<p><em>No blocked emails.</em></p>';
    return;
  }
  const rows = entries.map(b => `
    <tr>
      <td>${b.email}</td>
      <td>${b.reason || ''}</td>
      <td>${new Date(b.blocked_at * 1000).toLocaleString()}</td>
      <td><button data-email="${b.email}" class="unblock">Unblock</button></td>
    </tr>`).join('');
  container.innerHTML = `<table><thead><tr><th>Email</th><th>Reason</th><th>Blocked at</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  container.querySelectorAll('.unblock').forEach(btn => btn.onclick = () => withErrorAlert(async () => {
    await api(`/blocklist/${encodeURIComponent(btn.dataset.email)}`, { method: 'DELETE' });
    loadUsers();
    loadBlocklist();
  }));
}

function addBlock() {
  withErrorAlert(async () => {
    const email = document.getElementById('block-email').value.trim();
    const reason = document.getElementById('block-reason').value.trim();
    if (!email) return;
    await api('/blocklist', { method: 'POST', body: JSON.stringify({ email, reason: reason || null }) });
    document.getElementById('block-email').value = '';
    document.getElementById('block-reason').value = '';
    loadUsers();
    loadBlocklist();
  });
}

async function downloadConfig(email, issueDate) {
  const res = await fetch(`/admin/api/users/${encodeURIComponent(email)}/tokens/${issueDate}/continue-config`, {
    headers: authHeaders(),
  });
  if (!res.ok) throw new Error((await res.text()) || res.statusText);
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `hound-coder-continue-config-${email}.yaml`;
  a.click();
  URL.revokeObjectURL(url);
}

async function withErrorAlert(fn) {
  try {
    await fn();
  } catch (e) {
    alert(e.message);
  }
}

function addUser() {
  withErrorAlert(async () => {
    const email = document.getElementById('new-email').value.trim();
    const isAdmin = document.getElementById('new-is-admin').checked;
    if (!email) return;
    await api('/users', { method: 'POST', body: JSON.stringify({ email, is_admin: isAdmin }) });
    document.getElementById('new-email').value = '';
    loadUsers();
  });
}

loadUsers();
loadBlocklist();
</script>
</body>
</html>
