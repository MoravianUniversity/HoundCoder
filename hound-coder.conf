# /etc/nginx/sites-available/hound-coder.conf
upstream completions_backend { server 127.0.0.1:8001; }
upstream chat_backend { server 127.0.0.1:8002; }
upstream auth_backend { server 127.0.0.1:8003; }

# Records who used which token to hit the model endpoints, including the prompt/message body sent (not the response, not the raw JWT)
log_format hound_usage '$time_iso8601 email=$auth_email iat=$auth_iat "$request" status=$status body=$request_body';

server {
    # Host-specific overrides (listen, server_name, TLS, etc.) — not tracked in git, see local.conf.example
    include /opt/hound-coder/local.conf;

    # Internal authentication route
    location = /_validate_token {
        internal;
        proxy_pass http://auth_backend/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # 1. Routes /tab/ to tab completion model
    location /tab/ {
        auth_request /_validate_token;
        auth_request_set $auth_email $upstream_http_x_auth_email;
        auth_request_set $auth_iat $upstream_http_x_auth_iat;
        client_body_buffer_size 1m;   # keep prompt bodies in memory instead of spilling to a temp file, so $request_body is populated
        access_log /opt/hound-coder/usage.log hound_usage;
        proxy_pass http://completions_backend/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 2. Routes /chat/v1 to chat agent
    location /chat/ {
        auth_request /_validate_token;
        auth_request_set $auth_email $upstream_http_x_auth_email;
        auth_request_set $auth_iat $upstream_http_x_auth_iat;
        client_body_buffer_size 1m;   # keep prompt bodies in memory instead of spilling to a temp file, so $request_body is populated
        access_log /opt/hound-coder/usage.log hound_usage;
        proxy_pass http://chat_backend/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 3. Admin API + UI for managing allowed users/tokens (app enforces its own admin check)
    location /admin/ {
        proxy_pass http://auth_backend/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
